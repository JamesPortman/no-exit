<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a5a38" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#54381e" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="candle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd98a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ec4c8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5a8a90" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c883" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#9a7328" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- candle glow washing the left shelves -->
  <circle cx="330" cy="330" r="330" fill="url(#candle)"/>

  <!-- shelf boards -->
  <rect x="60" y="240" width="520" height="14" fill="url(#wood)"/>
  <rect x="60" y="470" width="520" height="14" fill="url(#wood)"/>

  <!-- top shelf: bell jar with brass finch, stacked books, potion bottle -->
  <g transform="translate(160 240)">
    <path d="M-48 0 v-128 a48 48 0 0 1 96 0 V0 Z" fill="url(#glass)"/>
    <rect x="-56" y="0" width="112" height="10" rx="4" fill="url(#brass)"/>
    <!-- the finch -->
    <g fill="#b98f3e" fill-opacity="0.7">
      <ellipse cx="2" cy="-46" rx="17" ry="11"/>
      <circle cx="18" cy="-56" r="7"/>
      <path d="M24 -56 l12 3 -12 4 Z"/>
      <path d="M-14 -44 l-14 8 10 4 Z"/>
      <path d="M2 -35 v10 M8 -35 v10" stroke="#7a5a28" stroke-opacity="0.6" stroke-width="2"/>
    </g>
  </g>
  <g transform="translate(340 240)">
    <rect x="-64" y="-26" width="128" height="26" rx="2" fill="#8a2f3c" fill-opacity="0.45"/>
    <rect x="-54" y="-52" width="108" height="26" rx="2" fill="#2f5e8a" fill-opacity="0.4"/>
    <rect x="-44" y="-78" width="88" height="26" rx="2" fill="#5e8a2f" fill-opacity="0.35"/>
    <path d="M-40 -13 h80 M-34 -39 h68 M-26 -65 h52" stroke="#e8c883" stroke-opacity="0.4" stroke-width="2"/>
  </g>
  <g transform="translate(490 240)">
    <path d="M-22 0 h44 v-44 a22 22 0 0 0 -13 -20 v-16 h-18 v16 a22 22 0 0 0 -13 20 Z" fill="url(#glass)"/>
    <rect x="-11" y="-84" width="22" height="8" rx="3" fill="url(#brass)"/>
  </g>

  <!-- lower shelf: globe and mantel clock -->
  <g transform="translate(190 470)">
    <circle cx="0" cy="-52" r="40" fill="#2f5e8a" fill-opacity="0.35"/>
    <path d="M-40 -52 h80 M0 -92 a40 40 0 0 1 0 80 M-28 -80 q28 14 56 0 M-28 -24 q28 -14 56 0" stroke="#9ec4c8" stroke-opacity="0.45" stroke-width="2" fill="none"/>
    <path d="M-26 0 h52 M-16 0 l7 -16 M16 0 l-7 -16" stroke="url(#brass)" stroke-width="5" fill="none"/>
  </g>
  <g transform="translate(400 470)">
    <path d="M-52 0 v-56 a52 44 0 0 1 104 0 V0 Z" fill="url(#wood)"/>
    <circle cx="0" cy="-52" r="30" fill="#efe6cf" fill-opacity="0.35"/>
    <path d="M0 -52 L0 -70 M0 -52 L12 -44" stroke="#54381e" stroke-opacity="0.7" stroke-width="3"/>
    <path d="M0 -78 v4 M18 -70 l-3 3 M26 -52 h-4 M-18 -70 l3 3 M-26 -52 h4" stroke="#54381e" stroke-opacity="0.5" stroke-width="2"/>
  </g>

  <!-- hanging pocket watch, right side, glowing -->
  <g transform="translate(880 260)">
    <circle cx="0" cy="0" r="120" fill="url(#candle)"/>
    <path d="M0 -160 v104" stroke="url(#brass)" stroke-width="4"/>
    <circle cx="0" cy="0" r="52" fill="none" stroke="url(#brass)" stroke-width="8"/>
    <circle cx="0" cy="0" r="40" fill="#efe6cf" fill-opacity="0.3"/>
    <path d="M0 0 L0 -26 M0 0 L18 10" stroke="#e8c883" stroke-opacity="0.7" stroke-width="4"/>
    <circle cx="0" cy="-62" r="8" fill="url(#brass)"/>
  </g>

  <!-- music box with floating notes -->
  <g transform="translate(950 600)">
    <rect x="-130" y="-64" width="260" height="64" rx="10" fill="url(#wood)"/>
    <path d="M-130 -64 L-100 -110 L160 -110 L130 -64 Z" transform="translate(-15 0)" fill="url(#wood)"/>
    <path d="M-96 -32 h40 M56 -32 h40" stroke="url(#brass)" stroke-width="4"/>
    <circle cx="0" cy="-32" r="17" fill="none" stroke="url(#brass)" stroke-width="5"/>
    <!-- notes drifting up -->
    <g fill="#e8c883" fill-opacity="0.6">
      <g transform="translate(-40 -150) rotate(-12)"><ellipse cx="0" cy="0" rx="8" ry="6"/><path d="M7 -2 v-30 q0 -8 12 -6" stroke="#e8c883" stroke-opacity="0.6" stroke-width="3" fill="none"/></g>
      <g transform="translate(30 -200) rotate(10)"><ellipse cx="0" cy="0" rx="7" ry="5"/><path d="M6 -2 v-26 q0 -7 10 -5" stroke="#e8c883" stroke-opacity="0.5" stroke-width="3" fill="none"/></g>
      <g transform="translate(90 -140) rotate(-6)"><ellipse cx="0" cy="0" rx="6" ry="4.5"/><path d="M5 -2 v-22" stroke="#e8c883" stroke-opacity="0.45" stroke-width="3" fill="none"/></g>
    </g>
  </g>

  <!-- dust motes in the candlelight -->
  <g fill="#ffd98a">
    <circle cx="300" cy="180" r="2.5" fill-opacity="0.35"/>
    <circle cx="420" cy="340" r="2" fill-opacity="0.3"/>
    <circle cx="240" cy="400" r="2" fill-opacity="0.3"/>
    <circle cx="700" cy="500" r="2" fill-opacity="0.25"/>
    <circle cx="1060" cy="380" r="2" fill-opacity="0.25"/>
  </g>
</svg>
