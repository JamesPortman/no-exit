<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a6a8a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0e2a3a" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="portlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7dd0e8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7dd0e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hullmetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a6a7a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2e3a45" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="sonarglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4caf6e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4caf6e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- deep water wash -->
  <rect width="1200" height="800" fill="url(#depth)"/>

  <!-- the great porthole -->
  <g transform="translate(340 320)">
    <circle r="240" fill="url(#portlight)"/>
    <circle r="190" fill="#0e2a3a" fill-opacity="0.3"/>
    <circle r="190" fill="none" stroke="url(#hullmetal)" stroke-width="26"/>
    <g fill="#5a6a7a" fill-opacity="0.6">
      <circle cx="0" cy="-206" r="9"/><circle cx="146" cy="-146" r="9"/>
      <circle cx="206" cy="0" r="9"/><circle cx="146" cy="146" r="9"/>
      <circle cx="0" cy="206" r="9"/><circle cx="-146" cy="146" r="9"/>
      <circle cx="-206" cy="0" r="9"/><circle cx="-146" cy="-146" r="9"/>
    </g>
    <!-- light rays from above through the glass -->
    <path d="M-60 -190 L-110 60 L-40 60 Z" fill="#7dd0e8" fill-opacity="0.12"/>
    <path d="M30 -190 L0 80 L80 60 Z" fill="#7dd0e8" fill-opacity="0.09"/>
    <!-- fish silhouettes -->
    <g fill="#1e4657" fill-opacity="0.55">
      <path d="M-80 -40 q22 -14 44 0 q-22 14 -44 0 Z M-84 -40 l-14 -9 v18 Z"/>
      <path d="M20 20 q18 -11 36 0 q-18 11 -36 0 Z M17 20 l-12 -8 v16 Z"/>
      <path d="M-30 90 q15 -9 30 0 q-15 9 -30 0 Z M-33 90 l-10 -7 v14 Z"/>
    </g>
    <!-- jellyfish drifting -->
    <g stroke="#7dd0e8" stroke-opacity="0.35" fill="#7dd0e8" fill-opacity="0.15">
      <path d="M110 -60 a26 22 0 0 1 52 0 q-4 6 -52 0 Z"/>
      <path d="M116 -52 q-2 30 6 44 M132 -50 q0 34 -4 48 M148 -52 q4 28 -2 44" fill="none" stroke-width="2"/>
    </g>
  </g>

  <!-- rising bubbles -->
  <g fill="none" stroke="#7dd0e8">
    <circle cx="640" cy="560" r="8" stroke-opacity="0.3" stroke-width="2"/>
    <circle cx="660" cy="470" r="6" stroke-opacity="0.26" stroke-width="2"/>
    <circle cx="648" cy="390" r="5" stroke-opacity="0.22" stroke-width="2"/>
    <circle cx="668" cy="310" r="4" stroke-opacity="0.18" stroke-width="2"/>
  </g>

  <!-- radio rig, right -->
  <g transform="translate(920 460)">
    <rect x="-140" y="-90" width="280" height="150" rx="12" fill="url(#hullmetal)"/>
    <circle cx="-80" cy="-30" r="26" fill="none" stroke="#e0a83c" stroke-opacity="0.55" stroke-width="4"/>
    <path d="M-80 -30 L-66 -44" stroke="#e0a83c" stroke-opacity="0.6" stroke-width="4"/>
    <circle cx="-10" cy="-30" r="26" fill="none" stroke="#8a93a5" stroke-opacity="0.4" stroke-width="4"/>
    <path d="M-10 -30 L-24 -14" stroke="#8a93a5" stroke-opacity="0.5" stroke-width="4"/>
    <!-- frequency slider -->
    <rect x="40" y="-44" width="88" height="10" rx="5" fill="#0e2a3a" fill-opacity="0.5"/>
    <rect x="86" y="-50" width="8" height="22" rx="3" fill="#e0a83c" fill-opacity="0.7"/>
    <!-- speaker grille -->
    <path d="M-120 24 h240 M-120 36 h240 M-120 48 h240" stroke="#0e2a3a" stroke-opacity="0.45" stroke-width="5"/>
    <!-- signal waves leaving -->
    <path d="M150 -70 q30 -22 0 -44 M172 -60 q48 -34 0 -68" stroke="#4caf6e" stroke-opacity="0.5" stroke-width="4" fill="none"/>
  </g>

  <!-- sonar screen, top right -->
  <g transform="translate(1010 170)">
    <circle r="86" fill="url(#sonarglow)"/>
    <circle r="70" fill="none" stroke="#4caf6e" stroke-opacity="0.45" stroke-width="2"/>
    <circle r="46" fill="none" stroke="#4caf6e" stroke-opacity="0.3" stroke-width="2"/>
    <circle r="22" fill="none" stroke="#4caf6e" stroke-opacity="0.2" stroke-width="2"/>
    <path d="M0 0 L58 -40 L64 -30 Z" fill="#4caf6e" fill-opacity="0.35"/>
    <circle cx="-30" cy="26" r="4" fill="#4caf6e" fill-opacity="0.7"/>
  </g>

  <!-- depth gauge, bottom left -->
  <g transform="translate(150 660)">
    <circle r="56" fill="none" stroke="url(#hullmetal)" stroke-width="10"/>
    <path d="M0 0 L26 -34" stroke="#d9534f" stroke-opacity="0.6" stroke-width="4"/>
    <path d="M-40 -28 l8 6 M0 -50 v10 M40 -28 l-8 6" stroke="#8a93a5" stroke-opacity="0.5" stroke-width="3"/>
  </g>
</svg>
