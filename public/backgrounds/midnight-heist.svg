<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="gilt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c883" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#b98f3e" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8a6a28" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0.35" y2="0">
      <stop offset="0%" stop-color="#ffe9b0" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffe9b0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="canvas1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b8dd9" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#2c4a78" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="canvas2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d98a5b" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#78422c" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- picture rail -->
  <path d="M0 60 H1200" stroke="#b98f3e" stroke-opacity="0.25" stroke-width="4"/>

  <!-- gilded frame, seascape -->
  <g transform="translate(170 120)">
    <rect x="-8" y="-8" width="236" height="176" rx="6" fill="none" stroke="url(#gilt)" stroke-width="14"/>
    <rect x="14" y="14" width="192" height="132" fill="url(#canvas1)"/>
    <path d="M14 96 q30 -18 60 0 t60 0 t60 0 v50 h-180 Z" fill="#3a5e93" fill-opacity="0.2"/>
    <circle cx="160" cy="52" r="16" fill="#ffe9b0" fill-opacity="0.3"/>
    <path d="M118 -8 v-40 M118 -48 L170 -8 M118 -48 L66 -8" stroke="#b98f3e" stroke-opacity="0.3" stroke-width="2" fill="none"/>
  </g>

  <!-- gilded frame, portrait -->
  <g transform="translate(480 90)">
    <rect x="-8" y="-8" width="176" height="236" rx="6" fill="none" stroke="url(#gilt)" stroke-width="14"/>
    <rect x="14" y="14" width="132" height="192" fill="url(#canvas2)"/>
    <circle cx="80" cy="80" r="30" fill="#e8c8a0" fill-opacity="0.22"/>
    <path d="M44 206 q36 -80 72 0" fill="#5e3a20" fill-opacity="0.2"/>
  </g>

  <!-- THE EMPTY FRAME — wires cut -->
  <g transform="translate(790 110)">
    <rect x="-8" y="-8" width="256" height="196" rx="6" fill="none" stroke="url(#gilt)" stroke-width="14"/>
    <rect x="14" y="14" width="212" height="152" fill="#8a93a5" fill-opacity="0.07"/>
    <path d="M84 60 l24 34 M132 58 l-20 40" stroke="#d9534f" stroke-opacity="0.45" stroke-width="3" fill="none"/>
    <path d="M120 -8 v-42 M120 -50 L180 -8 M120 -50 L60 -8" stroke="#b98f3e" stroke-opacity="0.3" stroke-width="2" fill="none"/>
    <!-- small "missing" placard -->
    <rect x="92" y="176" width="56" height="20" rx="3" fill="#e8e6e1" fill-opacity="0.15" stroke="#8a93a5" stroke-opacity="0.3"/>
  </g>

  <!-- flashlight beam sweeping up from the floor -->
  <path d="M330 800 L620 300 L840 800 Z" fill="url(#beam)"/>
  <circle cx="620" cy="300" r="10" fill="#ffe9b0" fill-opacity="0.4"/>

  <!-- velvet rope -->
  <g transform="translate(150 610)" stroke-width="3" fill="none">
    <path d="M0 150 V30 M240 150 V30" stroke="#b98f3e" stroke-opacity="0.45"/>
    <circle cx="0" cy="20" r="9" fill="#e8c883" fill-opacity="0.4" stroke="none"/>
    <circle cx="240" cy="20" r="9" fill="#e8c883" fill-opacity="0.4" stroke="none"/>
    <path d="M0 40 q120 95 240 0" stroke="#a03a3a" stroke-opacity="0.5" stroke-width="7"/>
  </g>

  <!-- marble floor sheen -->
  <path d="M0 780 H1200" stroke="#8a93a5" stroke-opacity="0.18" stroke-width="2"/>
  <path d="M60 780 l60 -60 M1120 780 l-60 -60" stroke="#8a93a5" stroke-opacity="0.1" stroke-width="2"/>
</svg>
