<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" font-family="Georgia, serif">
  <rect width="640" height="500" fill="#181a20"/>
  <text x="320" y="36" text-anchor="middle" fill="#e0a83c" font-size="22" letter-spacing="3">BLACKWOOD GALLERY — NIGHT PLAN</text>
  <text x="320" y="58" text-anchor="middle" fill="#9aa3b2" font-size="13" font-style="italic">paintings currently hung per room</text>

  <!-- 3x3 room grid. Letter = room code, tally = paintings hung. -->
  <g stroke="#4a5261" stroke-width="2" fill="#20242d">
    <rect x="60"  y="80"  width="170" height="120"/>
    <rect x="235" y="80"  width="170" height="120"/>
    <rect x="410" y="80"  width="170" height="120"/>
    <rect x="60"  y="205" width="170" height="120"/>
    <rect x="235" y="205" width="170" height="120"/>
    <rect x="410" y="205" width="170" height="120"/>
    <rect x="60"  y="330" width="170" height="120"/>
    <rect x="235" y="330" width="170" height="120"/>
    <rect x="410" y="330" width="170" height="120"/>
  </g>

  <!-- Room letters and painting tallies (small frames) -->
  <g fill="#e8e6e1" font-size="34" text-anchor="middle">
    <text x="145" y="125">W</text>
    <text x="320" y="125">A</text>
    <text x="495" y="125">H</text>
    <text x="145" y="250">L</text>
    <text x="320" y="250">Y</text>
    <text x="495" y="250">A</text>
    <text x="145" y="375">L</text>
    <text x="320" y="375">S</text>
    <text x="495" y="375">S</text>
  </g>

  <!-- painting frames per room -->
  <g fill="#e0a83c">
    <!-- W : 5 -->
    <g transform="translate(95,150)"><rect width="14" height="11"/><rect x="20" width="14" height="11"/><rect x="40" width="14" height="11"/><rect x="60" width="14" height="11"/><rect x="80" width="14" height="11"/></g>
    <!-- A (top) : 8 -->
    <g transform="translate(255,150)"><rect width="14" height="11"/><rect x="20" width="14" height="11"/><rect x="40" width="14" height="11"/><rect x="60" width="14" height="11"/><rect x="80" width="14" height="11"/><rect x="100" width="14" height="11"/><rect y="16" width="14" height="11"/><rect x="20" y="16" width="14" height="11"/></g>
    <!-- H : 9 -->
    <g transform="translate(430,150)"><rect width="14" height="11"/><rect x="20" width="14" height="11"/><rect x="40" width="14" height="11"/><rect x="60" width="14" height="11"/><rect x="80" width="14" height="11"/><rect x="100" width="14" height="11"/><rect y="16" width="14" height="11"/><rect x="20" y="16" width="14" height="11"/><rect x="40" y="16" width="14" height="11"/></g>
    <!-- L (middle) : 7 -->
    <g transform="translate(95,275)"><rect width="14" height="11"/><rect x="20" width="14" height="11"/><rect x="40" width="14" height="11"/><rect x="60" width="14" height="11"/><rect x="80" width="14" height="11"/><rect y="16" width="14" height="11"/><rect x="20" y="16" width="14" height="11"/></g>
    <!-- Y : 3 -->
    <g transform="translate(280,275)"><rect width="14" height="11"/><rect x="20" width="14" height="11"/><rect x="40" width="14" height="11"/></g>
    <!-- A (right) : 4 -->
    <g transform="translate(440,275)"><rect width="14" height="11"/><rect x="20" width="14" height="11"/><rect x="40" width="14" height="11"/><rect x="60" width="14" height="11"/></g>
    <!-- L (bottom) : 6 -->
    <g transform="translate(95,400)"><rect width="14" height="11"/><rect x="20" width="14" height="11"/><rect x="40" width="14" height="11"/><rect x="60" width="14" height="11"/><rect x="80" width="14" height="11"/><rect y="16" width="14" height="11"/></g>
  </g>

  <!-- Two closed storage rooms: no paintings -->
  <g fill="#9aa3b2" font-size="13" text-anchor="middle" font-style="italic">
    <text x="320" y="400">storage — empty</text>
    <text x="495" y="400">storage — empty</text>
  </g>
</svg>
