<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" font-family="Georgia, serif">
  <rect width="640" height="500" fill="#181a20"/>
  <text x="320" y="36" text-anchor="middle" fill="#e0a83c" font-size="22" letter-spacing="3">BLACKWOOD GALLERY — NIGHT PLAN</text>
  <text x="320" y="58" text-anchor="middle" fill="#9aa3b2" font-size="13" font-style="italic">room · paintings currently hung</text>

  <!-- 3x3 room grid. Letter = room code, figure = paintings hung. -->
  <g stroke="#4a5261" stroke-width="2" fill="#20242d">
    <rect x="60"  y="80"  width="170" height="120"/>
    <rect x="235" y="80"  width="170" height="120"/>
    <rect x="410" y="80"  width="170" height="120"/>
    <rect x="60"  y="205" width="170" height="120"/>
    <rect x="235" y="205" width="170" height="120"/>
    <rect x="410" y="205" width="170" height="120"/>
    <rect x="60"  y="330" width="170" height="120"/>
    <rect x="235" y="330" width="170" height="120"/>
    <rect x="410" y="330" width="170" height="120"/>
  </g>

  <!-- Room codes -->
  <g fill="#e8e6e1" font-size="34" text-anchor="middle">
    <text x="145" y="128">W</text>
    <text x="320" y="128">A</text>
    <text x="495" y="128">H</text>
    <text x="145" y="253">L</text>
    <text x="320" y="253">Y</text>
    <text x="495" y="253">A</text>
    <text x="145" y="378">L</text>
  </g>

  <!-- Paintings hung, written on the placard rather than tallied -->
  <g fill="#e0a83c" font-size="26" text-anchor="middle" font-family="monospace">
    <text x="145" y="172">5</text>
    <text x="320" y="172">8</text>
    <text x="495" y="172">9</text>
    <text x="145" y="297">7</text>
    <text x="320" y="297">3</text>
    <text x="495" y="297">4</text>
    <text x="145" y="422">6</text>
  </g>

  <!-- Two closed storage rooms: nothing hung, so never swept -->
  <g fill="#9aa3b2" font-size="13" text-anchor="middle" font-style="italic">
    <text x="320" y="385">storage</text>
    <text x="320" y="404">— empty —</text>
    <text x="495" y="385">storage</text>
    <text x="495" y="404">— empty —</text>
  </g>
</svg>
