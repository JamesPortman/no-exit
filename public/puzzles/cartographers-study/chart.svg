<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 760" font-family="Georgia, serif">
  <rect width="700" height="760" fill="#181a20"/>
  <text x="350" y="40" text-anchor="middle" fill="#e0a83c" font-size="22" letter-spacing="3">MERROW'S LAST CHART</text>
  <text x="350" y="64" text-anchor="middle" fill="#9aa3b2" font-size="13" font-style="italic">north is up · one square per bearing</text>

  <!-- grid -->
