    <path d="M250 292 q30 -16 50 2 q14 16 -10 26 q-32 12 -44 -6 q-6 -12 4 -22 Z"/>
    <path d="M396 290 q28 -14 48 2 q14 14 -8 26 q-30 12 -44 -6 q-6 -12 4 -22 Z"/>
    <path d="M542 290 q26 -14 44 2 q12 16 -8 26 q-28 10 -40 -6 q-6 -12 4 -22 Z"/>
    <path d="M110 435 q28 -16 48 0 q16 16 -8 28 q-30 12 -44 -6 q-8 -12 4 -22 Z"/>
