<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Georgia, serif">
  <rect width="640" height="420" fill="#0c0e16"/>
  <text x="320" y="34" text-anchor="middle" fill="#e0a83c" font-size="20" letter-spacing="3">PLATE XIV — THE ANONYMOUS CLUSTER</text>
  <text x="320" y="56" text-anchor="middle" fill="#9aa3b2" font-size="12" font-style="italic">the brighter the star, the larger it is drawn</text>

  <!-- faint background stars -->
  <g fill="#3a4152">
    <circle cx="80" cy="120" r="1.5"/><circle cx="150" cy="300" r="1.2"/>
    <circle cx="240" cy="90" r="1.4"/><circle cx="330" cy="360" r="1.3"/>
    <circle cx="430" cy="110" r="1.2"/><circle cx="560" cy="330" r="1.5"/>
    <circle cx="600" cy="150" r="1.2"/><circle cx="60" cy="370" r="1.3"/>
    <circle cx="500" cy="250" r="1.2"/><circle cx="200" cy="200" r="1.3"/>
  </g>

  <!-- The five labeled stars, sizes strictly descending C > O > M > E > T,
       positions scattered so order comes only from brightness. -->
  <g fill="#e8e6e1">
    <circle cx="470" cy="300" r="16"/>  <!-- C : brightest -->
    <circle cx="140" cy="150" r="12"/>  <!-- O -->
    <circle cx="360" cy="200" r="9"/>   <!-- M -->
    <circle cx="250" cy="330" r="6"/>   <!-- E -->
    <circle cx="540" cy="90"  r="3.5"/> <!-- T : dimmest -->
  </g>
  <g fill="#e0a83c" font-size="20" text-anchor="middle">
    <text x="470" y="345">C</text>
    <text x="140" y="192">O</text>
    <text x="360" y="238">M</text>
    <text x="250" y="364">E</text>
    <text x="540" y="122">T</text>
  </g>
</svg>
